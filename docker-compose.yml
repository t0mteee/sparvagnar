# Spårvagnskartan på servern, helt skild från Home Assistant i rahbari.
#
#   Starta:   docker compose up -d
#   Med nätet: docker compose --profile natet up -d (Cloudflare Tunnel)
#   Sidan:    http://localhost:8125 (PORT i .env)
#   Logg:     docker compose logs -f sparvagnar
#   Läge:     curl -s localhost:8125/api/status
#
# Koden läses direkt från repot, det finns inget byggsteg: efter git pull
# räcker docker compose restart sparvagnar. Tidtabellen och dagens cache
# hamnar i data/ (gitignorerad).

services:
  sparvagnar:
    container_name: sparvagnar
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "server/server.py"]
    ports:
      - "${PORT:-8125}:8125"
    environment:
      DATA: /data
      VASTTRAFIK_KEY: ${VASTTRAFIK_KEY:-}
      VASTTRAFIK_SECRET: ${VASTTRAFIK_SECRET:-}
      TRAFIKLAB_KEY: ${TRAFIKLAB_KEY:-}
    volumes:
      - ./server:/app/server:ro
      - ./web:/app/web:ro
      - ./layout:/app/layout:ro
      - ./data:/data

  # Vägen ut på nätet: Cloudflare Tunnel, så att sidan nås utan Tailscale och
  # utan öppna portar i routern. Tunneln och adressen skapas i Cloudflare
  # Zero Trust (se README.md), token i .env. Pekar på http://sparvagnar:8125.
  # Startas bara med profilen "natet":
  #   docker compose --profile natet up -d
  tunnel:
    container_name: sparvagnar-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["natet"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - sparvagnar
