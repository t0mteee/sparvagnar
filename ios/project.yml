# Appen Trafiken. Xcode-projektet genereras från den här filen:
#
#   cd ios && xcodegen generate && open Trafiken.xcodeproj
#
# Serverns adress, bundle-id och utvecklarteam står i Konfig/Lokal.xcconfig,
# som inte checkas in (utgå från Konfig/Lokal.exempel.xcconfig).
name: Trafiken
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Konfig/Bas.xcconfig
  Release: Konfig/Bas.xcconfig
targets:
  Trafiken:
    type: application
    platform: iOS
    sources:
      - path: Trafiken
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRAFIKEN_BUNDLE_ID)
        INFOPLIST_FILE: Konfig/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Trafiken
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Appen visar vilken hållplats som ligger närmast dig.
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
