<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spårvagnskartan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Kontrollrum: kartan fyller skärmen, instrumenten flyter ovanpå i hörnen. */
:root {
  --bg: #0b1016;
  --panel: rgba(16, 23, 31, 0.88);
  --rule: #223040;
  --text: #dce5ee;
  --muted: #8395a7;
  --signal: #ffb547;
  --live: #5fd38d;
  --station: #e4ebf2;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font-family: var(--display); overflow: hidden; }
.app { position: relative; height: 100%; overflow: hidden; }
#karta { position: absolute; inset: 0; touch-action: none; cursor: grab; }
#karta.drar { cursor: grabbing; }
#karta svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vagnar { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* transitmaps karta, omfärgad för mörk bakgrund */
#karta .transit-edge-outline, #karta .inner-geom-outline { stroke: var(--bg) !important; }
#karta .transit-edge-outline.L-11, #karta .inner-geom-outline.L-11 { stroke: #7b8a99 !important; stroke-width: 6.6 !important; }
#karta .station-poly { fill: var(--station); stroke: var(--bg); stroke-width: 0.8; }
#karta .station-label { fill: #a7b6c4; font-family: var(--display); font-weight: 600; }
#karta .line-label { font-family: var(--display); }
#karta .L { transition: opacity 0.25s; }

.panel {
  position: absolute; z-index: 2;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.topp {
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(12px, env(safe-area-inset-left, 0px));
  padding: 10px 14px 12px; display: grid; gap: 2px; min-width: 0; max-width: calc(100% - 24px);
}
.topp h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.klocka { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.status { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 15px; color: var(--muted); }
.status b { color: var(--signal); font-family: var(--mono); font-weight: 600; font-size: 14px; }
.lage { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--signal); }
.lage.live { color: var(--live); }
.lage.live::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--live); vertical-align: 1px; }
.topp.spelar .klocka { color: var(--signal); }
.meddelande { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: 15px; color: var(--muted); max-width: 34ch; }
.meddelande b { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--text); }
.meddelande button { min-height: 30px; padding: 3px 10px; }

.styr {
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding: 10px 12px; display: grid; gap: 10px;
}
.rad { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button {
  font: inherit; font-size: 15px; font-weight: 600; color: var(--text);
  background: #182230; border: 1px solid var(--rule); border-radius: 4px;
  padding: 6px 11px; cursor: pointer; min-height: 34px;
}
button:hover { border-color: #3a4c60; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--signal); color: #1a1205; border-color: var(--signal); }
#live[aria-pressed="true"] { background: var(--live); border-color: var(--live); color: #04140a; }
.fart { font-family: var(--mono); font-size: 13px; }
#tid { flex: 1 1 160px; min-width: 0; accent-color: var(--signal); }
.linjer { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  min-width: 34px; padding: 4px 8px; font-family: var(--display); font-size: 16px; font-weight: 700;
  border: 2px solid transparent; border-radius: 4px; line-height: 1.2; min-height: 30px;
}
.chip[aria-pressed="true"] { border-color: var(--signal); }
.chip.dimmad { opacity: 0.35; }

.kort {
  top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px));
  width: min(320px, calc(100% - 24px)); padding: 12px 14px; display: grid; gap: 6px;
}
.kort .huvud { display: flex; align-items: center; gap: 10px; padding-right: 36px; }
.bricka { font-size: 22px; font-weight: 700; min-width: 40px; text-align: center; padding: 2px 8px; border-radius: 4px; }
.kort .mot { font-size: 20px; font-weight: 600; line-height: 1.15; min-width: 0; }
.kort .rader { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 16px; margin: 0; }
.kort .rader dt { color: var(--muted); }
.kort .rader dd { margin: 0; font-variant-numeric: tabular-nums; }
.kort .rader dd span { font-family: var(--mono); font-size: 13px; color: var(--signal); }
.kort .stang { position: absolute; top: 6px; right: 6px; min-height: 28px; padding: 2px 8px; }
.sen { color: var(--signal); }
.itid { color: var(--live); }
.kalla { font-size: 12px; color: var(--muted); line-height: 1.4; }

@media (max-width: 640px) {
  .kort { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); left: max(12px, env(safe-area-inset-left, 0px)); width: auto; z-index: 3; }
  .klocka { font-size: 28px; }
}
@media (max-height: 520px) { .kalla { display: none; } }
</style>
</head>
<body>
<div class="app">
  <div id="karta" aria-label="Schematisk karta över Göteborgs spårvagnsnät">
    <canvas id="vagnar"></canvas>
  </div>

  <header class="panel topp">
    <h1>Spårvagnar i Göteborg</h1>
    <div class="klocka" id="klocka">--:--:--</div>
    <div class="status"><span><b id="antal">0</b> vagnar i trafik</span><span class="lage" id="lage">Startar</span></div>
    <div class="meddelande" id="meddelande" hidden></div>
  </header>

  <section class="panel kort" id="kort" hidden aria-live="polite">
    <button class="stang" id="stang" aria-label="Stäng">✕</button>
    <div class="huvud"><span class="bricka" id="k-linje"></span><span class="mot" id="k-mot"></span></div>
    <dl class="rader" id="k-rader"></dl>
  </section>

  <section class="panel styr" aria-label="Tid och linjer">
    <div class="rad">
      <button id="live" aria-pressed="true">Live</button>
      <button class="fart" data-fart="0" aria-label="Paus">❚❚</button>
      <button class="fart" data-fart="1">1×</button>
      <button class="fart" data-fart="10">10×</button>
      <button class="fart" data-fart="60">60×</button>
      <input type="range" id="tid" min="0" max="86399" step="60" aria-label="Tid på dygnet">
    </div>
    <div class="linjer" id="linjer" aria-label="Markera en linje"></div>
    <div class="kalla" id="kalla">Positioner från Västtrafik. Tidtabell från Samtrafiken via Trafiklab. Schematisk layout genererad med LOOM.</div>
  </section>
</div>

<script>
(async () => {
  const karta = document.getElementById("karta");
  const canvas = document.getElementById("vagnar");
  const ctx = canvas.getContext("2d");
  const lageEl = document.getElementById("lage"), meddelande = document.getElementById("meddelande");
  const vanta = ms => new Promise(r => setTimeout(r, ms));
  const linjeRad = document.getElementById("linjer");
  const stil = document.createElement("style"); document.head.appendChild(stil);
  let markerad = null;

  // Kartan och dagens tidtabell från servern.
  lageEl.textContent = "Laddar kartan";
  karta.insertAdjacentHTML("afterbegin", await (await fetch("karta.svg")).text());
  const svg = karta.querySelector("svg");
  svg.removeAttribute("width"); svg.removeAttribute("height");
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

  async function hamtaDag() {
    for (;;) {
      try {
        const r = await fetch("api/dag");
        const j = await r.json();
        if (r.ok) return j;
        lageEl.textContent = "Laddar tidtabellen";
        visaMeddelande(j.fel ? `Tidtabellen: ${j.fel}` : "Servern bygger dagens tidtabell.");
      } catch { visaMeddelande("Får inget svar från servern."); }
      await vanta(5000);
    }
  }
  let senastMeddelande = null;
  function visaMeddelande(html, knapp) {
    const nyckel = (html || "") + "|" + (knapp ? knapp.text : "");
    if (nyckel === senastMeddelande) return;
    senastMeddelande = nyckel;
    meddelande.hidden = !html;
    meddelande.innerHTML = html || "";
    if (knapp) { const b = document.createElement("button"); b.textContent = knapp.text; b.onclick = knapp.gor; meddelande.appendChild(b); }
  }

  let D, hopp, turer, linjer, stationPos;
  function lasIn(d) {
    D = d; linjer = d.linjer;
    hopp = d.hopp.map(p => {
      const n = p.length / 2, acc = new Float64Array(n);
      for (let i = 1; i < n; i++) acc[i] = acc[i - 1] + Math.hypot(p[2*i] - p[2*i-2], p[2*i+1] - p[2*i-1]);
      return { p, acc, len: acc[n - 1] };
    });
    turer = d.turer.map(([linje, mot, start, h, stopp, dd]) => {
      const n = stopp.length, ank = new Float64Array(n), avg = new Float64Array(n);
      let forra = start;
      for (let i = 0; i < n; i++) { ank[i] = forra + dd[2*i]; avg[i] = ank[i] + dd[2*i+1]; forra = avg[i]; }
      return { linje, mot, h, stopp, ank, avg, start: avg[0], slut: ank[n - 1] };
    });
    stationPos = new Map();
    for (const [n, x, y] of d.stationer) if (!stationPos.has(D.namn[n])) stationPos.set(D.namn[n], [x, y]);
    byggChips();
  }
  lasIn(await hamtaDag());
  visaMeddelande("");
  const [W, H] = D.storlek;

  function punktPa(h, f) {
    const mal = h.len * f, a = h.acc, p = h.p;
    let lo = 0, hi = a.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (a[m] <= mal) lo = m; else hi = m; }
    const seg = a[hi] - a[lo] || 1, t = (mal - a[lo]) / seg;
    return [p[2*lo] + (p[2*hi] - p[2*lo]) * t, p[2*lo+1] + (p[2*hi+1] - p[2*lo+1]) * t];
  }
  const mjuk = f => f * f * (3 - 2 * f);
  // Läget för en tur vid tiden t: punkt, och vilken hållplats den står vid eller är på väg till.
  function lage(tur, t) {
    if (t < tur.start || t > tur.slut) return null;
    const { ank, avg, h } = tur, n = ank.length;
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ank[m] <= t) lo = m; else hi = m; }
    if (t < avg[lo] || lo === n - 1) {
      const hh = lo > 0 ? h[lo - 1] : h[lo];
      return hh < 0 ? null : { xy: punktPa(hopp[hh], lo > 0 ? 1 : 0), star: lo };
    }
    if (h[lo] < 0) return null;
    const f = (t - avg[lo]) / Math.max(1, ank[lo + 1] - avg[lo]);
    return { xy: punktPa(hopp[h[lo]], mjuk(Math.min(1, Math.max(0, f)))), mot: lo + 1 };
  }

  const tid = s => { s = ((Math.round(s) % 86400) + 86400) % 86400;
    return [s / 3600 | 0, (s / 60 | 0) % 60].map(v => String(v).padStart(2, "0")).join(":"); };
  const tidSek = s => { s = ((Math.floor(s) % 86400) + 86400) % 86400;
    return [s / 3600 | 0, (s / 60 | 0) % 60, s % 60].map(v => String(v).padStart(2, "0")).join(":"); };
  const forsening = f => Math.abs(f) < 60 ? `<b class="itid">I tid</b>` :
    f > 0 ? `<b class="sen">${Math.round(f / 60)} min sen</b>` : `<b class="itid">${Math.round(-f / 60)} min tidig</b>`;

  // Klockan: Göteborgstid, eller uppspelning av tidtabellen med egen fart.
  const fmt = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Stockholm", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  function stockholmNu() {
    const p = Object.fromEntries(fmt.formatToParts(new Date()).map(x => [x.type, x.value]));
    return +p.hour * 3600 + +p.minute * 60 + +p.second + (Date.now() % 1000) / 1000;
  }
  const klocka = { bas: 0, ankare: 0, fart: 1, foljer: true };
  const nu = () => klocka.foljer ? stockholmNu()
    : (((klocka.bas + (performance.now() - klocka.ankare) / 1000 * klocka.fart) % 86400) + 86400) % 86400;
  function stall(bas, fart) {
    Object.assign(klocka, { bas, ankare: performance.now(), fart, foljer: false });
    knappar();
  }
  const tidReglage = document.getElementById("tid");
  document.getElementById("live").onclick = () => { klocka.foljer = true; knappar(); };
  document.querySelectorAll(".fart").forEach(b => b.onclick = () => stall(nu(), +b.dataset.fart));
  tidReglage.oninput = () => stall(+tidReglage.value, klocka.foljer ? 1 : klocka.fart || 1);

  // Realtiden: hämtas var 5:e sekund medan sidan syns.
  const live = { vagnar: new Map(), hamtad: 0, alder: null, fel: null, dag: null };
  async function hamtaLive() {
    if (document.visibilityState === "visible") {
      try {
        const j = await (await fetch("api/live")).json();
        live.fel = j.fel;
        if (j.tid) {
          live.hamtad = performance.now() - (j.alder || 0) * 1000;
          const sedda = new Set();
          for (const v of j.vagnar) {
            sedda.add(v.ref);
            const g = live.vagnar.get(v.ref);
            const ny = { ...v, fMal: v.f ?? 0, fVisad: g && g.tur === v.tur ? g.fVisad : (v.f ?? 0) };
            live.vagnar.set(v.ref, ny);
          }
          for (const ref of live.vagnar.keys()) if (!sedda.has(ref)) live.vagnar.delete(ref);
          if (j.dag && j.dag !== D.dag && live.dag !== j.dag) { live.dag = j.dag; hamtaDag().then(lasIn); }
        }
      } catch { live.fel = "Får inget svar från servern."; }
    }
    setTimeout(hamtaLive, 5000);
  }
  const harLive = () => !live.fel && live.hamtad && performance.now() - live.hamtad < 30000;

  function knappar() {
    document.getElementById("live").setAttribute("aria-pressed", String(klocka.foljer));
    document.querySelectorAll(".fart").forEach(b => b.setAttribute("aria-pressed", String(!klocka.foljer && +b.dataset.fart === klocka.fart)));
    document.querySelector(".topp").classList.toggle("spelar", !klocka.foljer);
  }
  function uppdateraLage() {
    let text, klass = "";
    if (!klocka.foljer) {
      text = klocka.fart === 0 ? "Pausad" : `Tidtabell ${klocka.fart}×`;
      visaMeddelande(`Uppspelning. Klockan är egentligen <b>${tid(stockholmNu())}</b>`, { text: "Tillbaka till live", gor: () => { klocka.foljer = true; knappar(); } });
    } else if (harLive()) {
      const s = Math.round((performance.now() - live.hamtad) / 1000);
      text = `Live, ${s} s sedan`; klass = "live";
      visaMeddelande("");
    } else {
      text = "Tidtabell";
      visaMeddelande(live.fel ? `Ingen realtid: ${live.fel} Visar tidtabellen.` : live.hamtad ? "Realtiden har tystnat. Visar tidtabellen." : "");
    }
    lageEl.textContent = text; lageEl.className = "lage " + klass;
  }

  // Linjerna som chips; ett tryck markerar linjen.
  function byggChips() {
    linjeRad.textContent = "";
    linjer.forEach(l => {
      const b = document.createElement("button");
      b.className = "chip"; b.textContent = l.namn; b.style.background = l.farg; b.style.color = l.text;
      if (l.namn === "11") b.style.boxShadow = "inset 0 0 0 1px #7b8a99";
      b.setAttribute("aria-label", "Linje " + l.namn);
      b.onclick = () => { markerad = markerad === l.namn ? null : l.namn; markera(); };
      linjeRad.appendChild(b);
    });
    markera();
  }
  function markera() {
    [...linjeRad.children].forEach(b => {
      b.setAttribute("aria-pressed", String(markerad === b.textContent));
      b.classList.toggle("dimmad", markerad !== null && markerad !== b.textContent);
    });
    stil.textContent = markerad === null ? "" : `#karta .L:not(.L-${CSS.escape(markerad)}) { opacity: 0.13; }`;
  }

  // Vy: panorera och zooma med viewBox; vagnarna ritas på canvas i samma koordinater.
  const vy = { x: 0, y: 0, k: 1 };
  let bredd = 0, hojd = 0, minK = 1;
  function storlek() {
    const r = karta.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const forraB = bredd, forraH = hojd;
    bredd = r.width; hojd = r.height;
    canvas.width = Math.round(bredd * dpr); canvas.height = Math.round(hojd * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    minK = Math.min(bredd / W, hojd / H) * 0.95;
    if (!forraB) { // första gången: centrala Göteborg i bild
      const k = Math.max(minK, Math.min(bredd / 1250, hojd / 1250));
      vy.k = k; vy.x = 1450 - bredd / 2 / k; vy.y = 1950 - hojd / 2 / k;
    } else { vy.x += (forraB - bredd) / 2 / vy.k; vy.y += (forraH - hojd) / 2 / vy.k; }
    tillampa();
  }
  function tillampa() {
    vy.k = Math.max(minK, Math.min(minK * 40, vy.k));
    svg.setAttribute("viewBox", `${vy.x} ${vy.y} ${bredd / vy.k} ${hojd / vy.k}`);
  }
  function zooma(faktor, sx, sy) {
    const k2 = Math.max(minK, Math.min(minK * 40, vy.k * faktor));
    vy.x += sx / vy.k - sx / k2; vy.y += sy / vy.k - sy / k2; vy.k = k2; tillampa();
  }
  window.addEventListener("resize", storlek);

  const pekare = new Map();
  let flyttat = 0, nyp = null;
  karta.addEventListener("pointerdown", e => {
    karta.setPointerCapture(e.pointerId); pekare.set(e.pointerId, [e.clientX, e.clientY]);
    flyttat = 0; karta.classList.add("drar");
    if (pekare.size === 2) { const [a, b] = [...pekare.values()]; nyp = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  });
  karta.addEventListener("pointermove", e => {
    if (!pekare.has(e.pointerId)) return;
    const forra = pekare.get(e.pointerId); pekare.set(e.pointerId, [e.clientX, e.clientY]);
    const r = karta.getBoundingClientRect();
    if (pekare.size === 1) {
      flyttat += Math.abs(e.clientX - forra[0]) + Math.abs(e.clientY - forra[1]);
      vy.x -= (e.clientX - forra[0]) / vy.k; vy.y -= (e.clientY - forra[1]) / vy.k; tillampa();
    } else if (pekare.size === 2) {
      flyttat += 10;
      const [a, b] = [...pekare.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (nyp) zooma(d / nyp, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
      nyp = d;
    }
  });
  const slapp = e => {
    if (pekare.size === 1 && flyttat < 6) tryck(e);
    pekare.delete(e.pointerId); if (pekare.size < 2) nyp = null;
    if (!pekare.size) karta.classList.remove("drar");
  };
  karta.addEventListener("pointerup", slapp);
  karta.addEventListener("pointercancel", e => { pekare.delete(e.pointerId); nyp = null; karta.classList.remove("drar"); });
  karta.addEventListener("wheel", e => {
    e.preventDefault(); const r = karta.getBoundingClientRect();
    zooma(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  // Tryck på en vagn visar kortet. vald är en tur (tidtabell) eller en referens (live).
  let vald = null, synliga = [];
  const kort = document.getElementById("kort");
  function tryck(e) {
    const r = karta.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
    let bast = null, bd = 22;
    for (const v of synliga) { const d = Math.hypot(v.sx - sx, v.sy - sy); if (d < bd) { bd = d; bast = v.id; } }
    vald = bast; kort.hidden = !vald; if (vald) visaKort(nu());
  }
  document.getElementById("stang").onclick = () => { vald = null; kort.hidden = true; };
  function visaKort(t) {
    const lv = typeof vald === "string" ? live.vagnar.get(vald) : null;
    if (typeof vald === "string" && !lv) { vald = null; kort.hidden = true; return; }
    const tur = lv ? (lv.tur >= 0 ? turer[lv.tur] : null) : vald;
    const l = linjer.find(x => x.namn === (lv ? lv.l : linjer[tur.linje].namn)) || { namn: lv.l, farg: "#8a97a6", text: "#0b1016" };
    const b = document.getElementById("k-linje");
    b.textContent = l.namn; b.style.background = l.farg; b.style.color = l.text;
    b.style.boxShadow = l.namn === "11" ? "inset 0 0 0 1px #7b8a99" : "none";
    document.getElementById("k-mot").textContent = "mot " + (lv && lv.m ? lv.m : D.namn[tur.mot]);
    const rader = [];
    if (lv && !tur) {
      rader.push(["Nära", lv.nara], ["Läge", "Kunde inte kopplas till en tur i tidtabellen"]);
    } else {
      const f = lv ? lv.fMal : 0, lg = lage(tur, Math.min(tur.slut, Math.max(tur.start, t - f)));
      if (lv) rader.push(["Läge", forsening(f)]);
      if (lg && lg.star !== undefined) rader.push(["Står vid", `${D.namn[tur.stopp[lg.star]]} <span>avg ${tid(tur.avg[lg.star] + f)}</span>`]);
      else if (lg) rader.push(["Nästa", `${D.namn[tur.stopp[lg.mot]]} <span>${tid(tur.ank[lg.mot] + f)}</span>`]);
      rader.push(["Turen", `${D.namn[tur.stopp[0]]} <span>${tid(tur.start)}–${tid(tur.slut)}</span>`]);
    }
    document.getElementById("k-rader").innerHTML = rader.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("");
  }

  // Ritslingan.
  const klockEl = document.getElementById("klocka"), antalEl = document.getElementById("antal");
  let senastKort = 0, senastRuta = performance.now();
  function rita() {
    const t = nu(), nuMs = performance.now(), dt = Math.min(1, (nuMs - senastRuta) / 1000);
    senastRuta = nuMs;
    ctx.clearRect(0, 0, bredd, hojd);
    const r = Math.max(4, Math.min(13, 5.2 * vy.k));
    const lista = [];
    const ritaLive = klocka.foljer && harLive();
    if (ritaLive) {
      for (const [ref, v] of live.vagnar) {
        let xy, sen = 0, linjeIdx = linjer.findIndex(x => x.namn === v.l);
        if (v.tur >= 0 && turer[v.tur]) {
          // Visad försening följer den rapporterade mjukt: vagnen kan stanna, men aldrig backa.
          const diff = v.fMal - v.fVisad;
          v.fVisad = Math.abs(diff) > 300 ? v.fMal : v.fVisad + Math.max(-2 * dt, Math.min(dt, diff));
          const tur = turer[v.tur], lg = lage(tur, Math.min(tur.slut, Math.max(tur.start, t - v.fVisad)));
          if (!lg) continue;
          xy = lg.xy; sen = v.fMal;
        } else {
          xy = stationPos.get(v.nara); if (!xy) continue;
        }
        lista.push({ id: ref, linje: linjeIdx, xy, sen, los: v.tur < 0 });
      }
    } else {
      for (const tur of turer) {
        if (t < tur.start || t > tur.slut) continue;
        const lg = lage(tur, t); if (lg) lista.push({ id: tur, linje: tur.linje, xy: lg.xy, sen: 0 });
      }
    }
    synliga = [];
    for (const v of lista) {
      v.sx = (v.xy[0] - vy.x) * vy.k; v.sy = (v.xy[1] - vy.y) * vy.k;
      if (v.sx < -20 || v.sy < -20 || v.sx > bredd + 20 || v.sy > hojd + 20) continue;
      synliga.push(v);
    }
    const farg = v => linjer[v.linje] || { namn: "?", farg: "#8a97a6", text: "#0b1016" };
    const av = v => markerad !== null && markerad !== farg(v).namn;
    for (const v of synliga) {
      const l = farg(v);
      ctx.globalAlpha = av(v) ? 0.12 : 0.22;
      ctx.fillStyle = l.namn === "11" ? "#9aa8b6" : l.farg;
      ctx.beginPath(); ctx.arc(v.sx, v.sy, r * 1.9, 0, 6.2832); ctx.fill();
    }
    for (const v of synliga) {
      const l = farg(v), vald_ = v.id === vald;
      ctx.globalAlpha = av(v) ? 0.2 : 1;
      if (v.sen > 180) { ctx.strokeStyle = "#ffb547"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(v.sx, v.sy, r * 1.45, 0, 6.2832); ctx.stroke(); }
      ctx.fillStyle = v.los ? "#0b1016" : l.farg;
      ctx.strokeStyle = vald_ ? "#ffffff" : v.los ? l.farg : l.namn === "11" ? "#9aa8b6" : "#0b1016";
      ctx.lineWidth = vald_ ? 3 : v.los ? 2.5 : 1.5;
      ctx.beginPath(); ctx.arc(v.sx, v.sy, vald_ ? r * 1.35 : r, 0, 6.2832); ctx.fill(); ctx.stroke();
      if (r >= 9 && !v.los) {
        ctx.fillStyle = l.text; ctx.font = `700 ${Math.round(r * 1.15)}px "Barlow Condensed", sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(l.namn, v.sx, v.sy + 0.5);
      }
    }
    ctx.globalAlpha = 1;
    klockEl.textContent = tidSek(t);
    antalEl.textContent = lista.length;
    if (document.activeElement !== tidReglage) tidReglage.value = Math.floor(t);
    if (nuMs - senastKort > 250) {
      uppdateraLage();
      if (vald) visaKort(t);
      senastKort = nuMs;
    }
    requestAnimationFrame(rita);
  }

  storlek(); knappar(); hamtaLive(); requestAnimationFrame(rita);
})();
</script>
</body>
</html>
